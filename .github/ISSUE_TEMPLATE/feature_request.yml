name: Feature idea
description: Suggest something new or better for CMFxNothing (Unofficial)
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature and how you'd use it.
    validations:
      required: true

  - type: input
    id: earbuds
    attributes:
      label: Your earbuds (optional)
      placeholder: "e.g. Nothing Ear (a)"
