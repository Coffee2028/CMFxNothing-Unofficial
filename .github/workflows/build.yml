name: Build CMFxNothing

# Builds the Windows installer and the Mac apps on GitHub's own computers and
# publishes them on the Releases page as "CMFxNothing <version>".
#
# Runs automatically when package.json (for example a version bump) or this
# file changes on main, or by hand: Actions tab -> "Build CMFxNothing" -> "Run workflow".

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/build.yml

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: dist:win
          - name: Mac
            os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install tools
        run: npm ci

      - name: Build app
        run: npm run ${{ matrix.script }}
        env:
          # No paid signing certificates: Windows stays unsigned, the Mac app is ad-hoc signed
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v7
        with:
          name: cmfxnothing-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" > notes.md

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: CMFxNothing ${{ steps.version.outputs.version }}
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/*
          # Notes = this version's CHANGELOG.md section + install steps (scripts/release-notes.mjs)
          body_path: notes.md
