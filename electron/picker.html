<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; font-src file:; script-src 'unsafe-inline'">
  <title>Choose your earbuds</title>
  <style>
    @font-face { font-family: 'Space Mono'; src: url('../web/dist/fonts/space-mono-latin-400-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Manrope'; src: url('../web/dist/fonts/manrope-latin-400-normal.woff2') format('woff2'); }

    * { box-sizing: border-box; user-select: none; }
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: column;
      background: #0a0a0a; color: #fff; font-family: 'Manrope', sans-serif;
    }
    header { padding: 26px 24px 14px; }
    .eyebrow { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 2px; color: #666; }
    h1 { margin: 8px 0 0; font-size: 18px; font-weight: 400; }

    #list { flex: 1; overflow-y: auto; padding: 6px 16px; }
    .port {
      width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
      padding: 14px; margin-bottom: 8px; border-radius: 12px; cursor: pointer;
      background: rgba(255,255,255,0.03); border: 1px solid #262626; color: #ddd;
      font-family: inherit; transition: border-color .2s, background .2s;
    }
    .port:hover, .port:focus-visible { border-color: #E61E25; background: rgba(230,30,37,0.08); outline: none; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #444; flex-shrink: 0; }
    .port.likely .dot { background: #E61E25; box-shadow: 0 0 8px #E61E25; }
    .name { font-size: 14px; }
    .detail { font-family: 'Space Mono', monospace; font-size: 10px; color: #666; margin-top: 3px; letter-spacing: 1px; }

    .empty { padding: 24px 8px; color: #888; font-size: 13px; line-height: 1.6; }
    .empty b { color: #fff; font-weight: 400; }
    .scan { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 2px; color: #E61E25; margin-bottom: 10px; animation: blink 1.4s infinite; }
    @keyframes blink { 50% { opacity: .3; } }

    footer { padding: 14px 16px 18px; border-top: 1px solid #1a1a1a; }
    #cancel {
      width: 100%; padding: 12px; border-radius: 30px; cursor: pointer;
      background: transparent; border: 1px solid #444; color: #888;
      font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1.5px;
    }
    #cancel:hover { color: #fff; border-color: #888; }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">BLUETOOTH</div>
    <h1>Choose your earbuds</h1>
  </header>
  <div id="list"></div>
  <footer><button id="cancel">CANCEL</button></footer>

  <script>
    const listEl = document.getElementById('list');

    function render(ports) {
      listEl.replaceChildren();
      if (!ports.length) {
        listEl.innerHTML =
          '<div class="empty"><div class="scan">SEARCHING…</div>' +
          'No earbuds found yet. Make sure they are <b>out of the case</b> and <b>paired in your computer's Bluetooth settings</b>.</div>';
        return;
      }
      ports.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'port' + (p.likely ? ' likely' : '');
        const dot = document.createElement('span'); dot.className = 'dot';
        const text = document.createElement('span');
        const name = document.createElement('div'); name.className = 'name'; name.textContent = p.label;
        text.appendChild(name);
        if (p.detail) { const d = document.createElement('div'); d.className = 'detail'; d.textContent = p.detail; text.appendChild(d); }
        btn.append(dot, text);
        btn.addEventListener('click', () => window.picker.choose(p.id));
        listEl.appendChild(btn);
      });
    }

    render([]);
    window.picker.onPorts(render);
    document.getElementById('cancel').addEventListener('click', () => window.picker.cancel());
    document.addEventListener('keydown', e => { if (e.key === 'Escape') window.picker.cancel(); });
  </script>
</body>
</html>
